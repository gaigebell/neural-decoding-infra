# Preprocessing pipeline config — `python -m recon.cli.preprocess`.
#
# Stage examples:
#   python -m recon.cli.preprocess stage=gpt_char_features subject=1 stories=[1]
#   python -m recon.cli.preprocess stage=semantic_downsample subject=1 stories=[1]
#   python -m recon.cli.preprocess stage=semantic_delay subject=1 stories=[1]
#   python -m recon.cli.preprocess stage=meg_zresp subject=1 stories=[1]
#   python -m recon.cli.preprocess stage=meg_context subject=1 stories=[1] n_context=5
#   python -m recon.cli.preprocess stage=fmri_cube subject=1 stories=[1]
#
# Re-runs skip artifacts whose sidecar matches (input hashes + params).

defaults:
  - paths: local
  - _self_

# Task selection
# gpt_char_features | semantic_downsample | semantic_delay | meg_zresp | meg_context |
# fmri_cube | meg_brainomni_segments | brainomni_encode
stage: null
subject: 1
stories: null          # null = 1..60
resume: true           # skip artifacts with valid sidecars

# Shared parameters (values are the legacy pipeline's — keep for equivalence)
layer: 10              # GPT-2 layer for zstim/features
layers: [10]           # layers to extract in gpt_char_features (legacy ran 0..12)
interval: 0.4          # MEG sampling grid (s)
first_char_onset_time: 12.0
channel_start: 12      # MEG channel slice 12:318 (306 ch)
channel_end: 318
n_context: 5           # meg_context window
fmri_start_row: 17     # fMRI grid offset (≈12.07 s)
delays: [1, 2, 3, 4]
context_len: 5         # GPT-2 char context window
gpt_device: cpu        # cuda on a GPU node

# BrainOmni stages (segments on CPU, encode on GPU)
brainomni_sample_rate: 256
brainomni_segment_length: 2   # seconds of MEG before each word onset
brainomni_x_scale: 1.0        # x amplitude scale. The golden artifacts are the
                              # calibrated-T segments × ~9.508e9 (empirically
                              # recovered, 2026-09-11); set 9.508e9 to reproduce
                              # the golden/model training scale when the input
                              # fif stores physical T.
brainomni_ckpt: base          # ckpt_collection/{base|tiny}/BrainOmni.pt
tokenizer_ckpt: braintokenizer
encode_device: cuda           # cuda | cpu

# BIDS inputs (environment-specific layout; defined in paths/{env}.yaml)
meg_fif_pattern: ${paths.meg_fif_pattern}
fmri_nii_pattern: ${paths.fmri_nii_pattern}
char_time_pattern: ${paths.char_time_pattern}

# Output roots (created on demand)
wordvector_dir: ${paths.processed_root}/wordvectors
meg_ds_dir: ${paths.processed_root}/MEG/downsample   # semantic ds + time_align (MEG grid)
fmri_ds_dir: ${paths.processed_root}/downsample     # semantic ds (fMRI grid)
zstim_dir: ${paths.processed_root}/MEG/zstim
zresp_dir: ${paths.processed_root}/MEG/zresp
fmri_zresp_dir: ${paths.processed_root}/zresp/cube

# English tokens to drop per story (legacy `eliminate_data` — dataset quirk)
eliminate_data: {5: [128,129,273,274,275,276,277,278,1107,1109,1110],
                 6: [73,74,75,76,691,692,950,951,1078,1079,1091,1092,1096,1097],
                 9: [345], 12: [319,1281,1282,1329,1330], 17: [66,81,82,190,312],
                 23: [790,791,792,793], 24: [59,60,61,62], 25: [904,905,906,907],
                 30: [371,372], 44: [202],
                 45: [12,94,168,224,277,330,369,436,513,577,636,742,793,1143],
                 49: [357,358,359,391,392,393],
                 51: [49,50,51,65,66,68,69,70,79,80,81,129,130,131,267,268,269,444,445,498,499,500],
                 52: [285,286,287], 53: [358], 57: [527]}
