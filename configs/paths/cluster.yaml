# Cluster-side paths (production)
# This is the default config used on the HPC cluster.

data_root: /home/test/reconstruction             # raw BIDS data (mydata/)
processed_root: /home/test/reconstruction/results_v2  # 新管线产物（训练输入）；旧 results/ 保留作参考
results_dir: /home/test/reconstruction/outputs   # training OUTPUTS (ckpt, metadata — separate from input data)
pretrained_root: /home/test/reconstruction/llm

# Specific paths
gpt_path: ${paths.pretrained_root}/gpt2-chinese-cluecorpussmall
brainomni_repo: /home/test/reconstruction/BrainOmni   # 需同步到集群
brainomni_path: ${paths.brainomni_repo}/ckpt_collection

# BIDS input patterns (relative to data_root; cluster has NO mydata/derivatives prefix)
meg_fif_pattern: "preprocessed_data/sub-{sub:02d}/MEG/sub-{sub:02d}_task-RDR_run-{story}_meg.fif"
fmri_nii_pattern: "preprocessed_data/sub-{sub:02d}/MNI/sub-{sub:02d}_task-RDR_run-{story}_bold.nii.gz"
char_time_pattern: "annotations/time_align/char-level/story_{story}_char_time.mat"  # 待确认集群实际路径
