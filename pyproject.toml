[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-decoding-infra"
version = "0.0.0"
description = "AI infrastructure for training and inference of non-invasive brain-to-text decoding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "owner", email = "owner@example.com" },
]
keywords = ["brain-computer-interface", "neural-decoding", "deep-learning", "meg", "fmri"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ───────────────────── Runtime dependencies ─────────────────────
# Core deps: always installed. Keep this list small.
# Heavy integrations (BrainOmni, large LMs, public datasets) go in optional-dependencies.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "transformers>=4.30",
    "huggingface-hub>=0.16",
    "pydantic>=2.5",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "nibabel>=5.0",
    "mne>=1.0",
    "h5py>=3.8",
    "tqdm>=4.65",
    "wandb>=0.15",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

# ───────────────────── Optional dependencies (extras) ─────────────────────
# Single conda env on the cluster installs ALL extras: `pip install -e ".[all]"`
# Local dev installs only what they need: `pip install -e ".[brainomni]"`
# Heavy packages MUST be lazy-imported — see recon/utils/optional.py and
# docs/standards/07-dependencies.md.
[project.optional-dependencies]
# ─────────────── Single integrations ───────────────
# BrainOmni: pretraining-based universal brain encoder.
# Update git URL to actual BrainOmni repo when available.
brainomni = [
    "brainomni @ git+https://github.com/your-org/brainomni.git@main",
    "transformers>=4.30",
    "accelerate>=0.20",
]

# Large language model decoding (vLLM + FlashAttention).
# Use this when replacing the GPT-2 Chinese decoder with larger models.
large-lm = [
    "vllm>=0.4",
    "flash-attn>=2.0",
]

# Public dataset integration (HuggingFace datasets).
# Use when ingesting BOLD5000, Zuco, Pereira2018, etc.
data-public = [
    "datasets>=2.14",
    "huggingface-hub>=0.16",
]

# ─────────────── Combinations ───────────────
brainomni-large-lm = [
    "neural-decoding-infra[brainomni,large-lm]",
]

# ─────────────── Full install (used on cluster) ───────────────
all = [
    "neural-decoding-infra[brainomni,large-lm,data-public]",
]

# ─────────────── Dev / test / lint ───────────────
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.5",
    "ipython>=8.0",
    "ipdb>=0.13",
]

# dev + all extras — convenience for full local dev
dev-all = [
    "neural-decoding-infra[dev,all]",
]

[project.urls]
Homepage = "https://github.com/<owner>/neural-decoding-infra"
Issues = "https://github.com/<owner>/neural-decoding-infra/issues"

# ───────────────────── Setuptools config ─────────────────────
[tool.setuptools]
packages = ["recon"]

[tool.setuptools.package-data]
recon = ["py.typed"]

[tool.setuptools.package-dir]
"" = "."

# ───────────────────── Ruff ─────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/", "build/", "dist/"]

[tool.ruff.lint]
# Default rules + a few extras
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line-too-long (covered by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]  # tests can use non-PEP8 names
"recon/cli/*" = ["N803"]      # CLI args often have non-PEP8 names

[tool.ruff.lint.isort]
known-first-party = ["recon"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ───────────────────── Mypy ─────────────────────
[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = false  # too strict for alpha; loosen
disallow_incomplete_defs = false
ignore_missing_imports = true  # mne / huggingface_hub etc. don't have stubs
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ───────────────────── Pytest ─────────────────────
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU (deselect with '-m \"not gpu\"')",
    "integration: marks integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:huggingface_hub.*",
    "ignore::DeprecationWarning:transformers.*",
]

# ───────────────────── Coverage ─────────────────────
[tool.coverage.run]
source = ["recon"]
omit = [
    "recon/cli/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
fail_under = 70