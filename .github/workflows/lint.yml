name: Lint

# GitHub Actions workflow for code quality checks.
# Runs on every push to any branch and on every PR.
# Does NOT run GPU tests (those run on the cluster — see ADR-0005).
#
# Extras matrix:
#   - core:  pip install -e ".[dev]"
#   - brainomni: pip install -e ".[dev,brainomni]" (skipped in CI — too heavy)
#   - all:   pip install -e ".[all,dev]" (skipped in CI — too heavy)
# In CI we test that the core package remains importable even without
# optional extras installed (see tests/unit/test_optional.py).

on:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ───────────────────── Lint (ruff + mypy) ─────────────────────
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core deps only (no extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify core imports without extras
        run: |
          python -c "import recon; print('core OK')"
          python -c "from recon.utils.optional import require_optional; print('optional OK')"
          python -c "from recon.models.registry import available_models; print('registry OK')"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy recon/
        continue-on-error: false

  # ───────────────────── Unit tests (CPU only) ─────────────────────
  test-unit:
    name: Unit tests (CPU, no extras)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core deps only (no extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests (verify extras fail gracefully)
        run: |
          # Core tests should all pass
          pytest tests/unit/ -v --tb=short --color=yes

          # Verify extras raise ImportError when not installed
          pytest tests/unit/test_optional.py -v --tb=short

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        run: |
          pytest tests/unit/ --cov=recon --cov-report=xml --cov-report=term

  # ───────────────────── Optional: test with BrainOmni (self-hosted runner) ─────────────────────
  # This job only runs on a self-hosted runner that has BrainOmni installed
  # (typically the cluster). Tagged with "self-hosted" to prevent GitHub-hosted
  # runners from attempting it.
  test-brainomni:
    name: Tests with BrainOmni extra (self-hosted only)
    runs-on: [self-hosted, cluster]
    needs: test-unit  # only run if core tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install with brainomni extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,brainomni]"

      - name: Verify brainomni import works
        run: |
          python -c "from recon.encoders.brainomni import is_brainomni_available; assert is_brainomni_available(), 'brainomni extra should be installed'"

      - name: Run unit tests (with brainomni available)
        run: pytest tests/unit/ -v --tb=short

  # ───────────────────── Doc checks ─────────────────────
  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint markdown
        run: markdownlint --config .markdownlint.json docs/ README.md CHANGELOG.md CONTRIBUTING.md

      - name: Check cross-links (basic)
        run: |
          python -c "
          import re, pathlib
          for md in pathlib.Path('docs').rglob('*.md'):
              for m in re.finditer(r'\[([^\]]+)\]\(([^)]+)\)', md.read_text()):
                  target = m.group(2)
                  if target.startswith(('http', '#', 'mailto:')):
                      continue
                  path = (md.parent / target).resolve()
                  if not path.exists():
                      print(f'BROKEN: {md}:{m.start()} -> {target}')
                      exit(1)
          print('All links OK.')
          "